name: kestrel-sigma-327-validation
on:
  push:
    branches: ['review/kestrel-sigma-327-accounting-20260906']
    paths:
      - 'tests/kestrel-sigma-327/**'
      - '.github/workflows/kestrel-sigma-327-validation.yml'
  workflow_dispatch:
permissions: {}
jobs:
  accounting:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - name: Fetch exact public replay source without repository credentials
        shell: bash
        run: |
          set -euo pipefail
          git init replay
          git -C replay fetch --depth=1 https://github.com/woahwhattheheck/kivaloo.git "$GITHUB_SHA"
          git -C replay checkout --detach FETCH_HEAD
          test "$(git -C replay rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Compile actual source and compare callback accounting
        shell: bash
        run: |
          set -euo pipefail
          python3 replay/tests/kestrel-sigma-327/run.py "$RUNNER_TEMP/kestrel-sigma-327"
      - name: Preserve bounded outcome evidence including failed expectations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kestrel-sigma-327-evidence
          path: |
            ${{ runner.temp }}/kestrel-sigma-327/logs/
            ${{ runner.temp }}/kestrel-sigma-327/results.json
            ${{ runner.temp }}/kestrel-sigma-327/log-sha256.json
          retention-days: 15
          if-no-files-found: error
